# ============================================
# 公共配置 — 所有环境共享
# ============================================

spring:
  config:
    import: prompt.yml
  profiles:
    active: dev           # 默认激活开发环境
  application:
    name: my-agent
  ai:
    dashscope:
      api-key: ${ALI_API_KEY}
      chat:
        options:
          timeout: 180000
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
    mcp:
      client:
        enabled: true
        request-timeout: 120000
      retry:
        max-attempts: 3
        backoff:
          initial-interval: 2000
          multiplier: 2
          max-interval: 10000
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

file:
  upload:
    path: ./uploads

server:
  port: 8123
  servlet:
    context-path: /api

# Swagger / Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: space.huyuhao.myagent.controller
knife4j:
  enable: true
  setting:
    language: zh_cn

# DashScope SDK 配置（向量嵌入服务使用）
dashscope:
  api:
    key: ${ALI_API_KEY}
  embedding:
    model: text-embedding-v3

# Milvus 公共配置
milvus:
  username: ""           # 用户名（空表示无认证）
  password: ""           # 密码
  database: default      # 数据库名
  timeout: 10000         # 连接超时（毫秒）
