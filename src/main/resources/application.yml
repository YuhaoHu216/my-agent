# ============================================
# 公共配置 — 所有环境共享
# ============================================

spring:
  config:
    import: prompt.yml
  profiles:
    active: prod           # 默认激活开发环境
  application:
    name: my-agent
  ai:
    dashscope:
      api-key: ${ALI_API_KEY}
      chat:
        options:
          timeout: 180000
          model: ${QWEN_MODEL:deepseek-v4-pro-0813}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# 用户自定义 MCP 配置
my-agent:
  mcp:
    request-timeout-ms: 30000
  document:
    # 规定格式（不带点、小写）：上传时向量化分片入知识库；其余扩展名文件仅存储（文件中转站）
    vectorizable-extensions: md,txt

file:
  upload:
    path: ./uploads

server:
  port: 8123
  servlet:
    context-path: /api

# Swagger / Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: space.huyuhao.myagent.controller
knife4j:
  enable: true
  setting:
    language: zh_cn

# DashScope SDK 配置（向量嵌入服务使用）
dashscope:
  api:
    key: ${ALI_API_KEY}
  embedding:
    model: text-embedding-v3

# Milvus 公共配置
milvus:
  username: ""           # 用户名（空表示无认证）
  password: ""           # 密码
  database: default      # 数据库名
  timeout: 10000         # 连接超时（毫秒）
