services:
  agent-api:
    image: agent-api:latest
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - ALI_API_KEY=sk-6d09a66691804ef485f400654b31a711
      - DEEPSEEK_API_KEY=sk-7e1e550309514d5db4d9905a59f2650e
      # JVM 内存限制（老年代实际用量 ~153MB；堆 640M 留足余量；stdio MCP 已移除，原 Node 子进程内存回归 JVM；MaxDirectMemorySize 防 Netty/SSL 直接内存无上限）
      - JAVA_OPTS=-Xmx640m -Xms512m -XX:MaxMetaspaceSize=160m -XX:MaxDirectMemorySize=256m -XX:+UseG1GC
      # 外部配置优先：挂载的 /config/application-prod.yml 覆盖 jar 内写死的老服务器 IP
      - SPRING_CONFIG_LOCATION=optional:file:/config/,classpath:/
    build:
      context: .
      dockerfile: ./dockerfile
    volumes:
      - ./uploads:/uploads
      - ./backend/application-prod.yml:/config/application-prod.yml:ro
    container_name: agent-api
    ports:
      - "8123:8123"
    # Docker 硬限制（heap 640M + metaspace ~130M + 直接内存 256M + 线程栈 ≈ 1.2G；47 服务器可用 ~1.37G）
    mem_limit: 1.3g
    restart: unless-stopped
    networks:
      - shared-infra

  agent-web:
    image: nginx
    container_name: agent-web
    ports:
      - "8180:5173"
    volumes:
      - "./frontend/nginx/nginx.conf:/etc/nginx/nginx.conf"
      - "./frontend/nginx/html:/usr/share/nginx/html"
    depends_on:
      - agent-api
    restart: unless-stopped
    networks:
      - shared-infra

  # Caddy：域名 agent.huyuhao.top → TLS 终止 → 反向代理到 agent-web(nginx)
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/data:/data
      - ./caddy/config:/config
    depends_on:
      - agent-web
    networks:
      - shared-infra

networks:
  shared-infra:
    name: shared-infra
    external: true
