services:
  my_agent:
    environment:
        - SPRING_PROFILES_ACTIVE=prod
        - ALI_API_KEY=sk-6d09a66691804ef485f400654b31a711
    build:
      context: .
      dockerfile: ./dockerfile
    volumes:
      - ./uploads:/uploads
    container_name: my_agent
    ports:
      - "8123:8123"
    networks:
      - shared-infra
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_healthy
      milvus:
        condition: service_started

  nginx:
    image: nginx
    container_name: nginx-my_agent
    ports:
      - "5173:5173"
    volumes:
      - "./frontend/nginx/nginx.conf:/etc/nginx/nginx.conf"
      - "./frontend/nginx/html:/usr/share/nginx/html"
    depends_on:
      - my_agent
    networks:
      - shared-infra

networks:
  shared-infra:
    name: shared-infra
    external: true
