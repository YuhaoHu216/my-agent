services:
  agent-api:
    image: agent-api:latest
    environment:
        - SPRING_PROFILES_ACTIVE=prod
        - ALI_API_KEY=sk-6d09a66691804ef485f400654b31a711
        # JVM 内存限制（老年代实际用量 ~153MB，留足余量）
        - JAVA_OPTS=-Xmx320m -Xms320m -XX:MaxMetaspaceSize=128m -XX:+UseG1GC
    build:
      context: .
      dockerfile: ./dockerfile
    volumes:
      - ./uploads:/uploads
    container_name: agent-api
    ports:
      - "8123:8123"
    # Docker 硬限制（heap 320M + metaspace ~100M + 线程栈 + Node.js MCP Server）
    mem_limit: 620m
    restart: unless-stopped
    networks:
      - shared-infra

  agent-web:
    image: nginx
    container_name: agent-web
    ports:
      - "80:5173"
    volumes:
      - "./frontend/nginx/nginx.conf:/etc/nginx/nginx.conf"
      - "./frontend/nginx/html:/usr/share/nginx/html"
    depends_on:
      - agent-api
    restart: unless-stopped
    networks:
      - shared-infra

networks:
  shared-infra:
    name: shared-infra
    external: true
