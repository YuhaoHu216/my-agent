services:
  infra-redis:
    image: redis:7.4-alpine
    container_name: infra-redis
    ports:
      - "6379:6379"
    volumes:
      - ./backend/redis/data:/data
      - ./backend/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - shared-infra

  infra-mysql:
    image: mysql:8.0
    container_name: infra-mysql
    ports:
      - "3306:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: Zf9@Qv7!Lm2Xc8$HpT8+rK!2pWq9@Vx6$Mn
      MYSQL_DATABASE: my_agent
    volumes:
      - "./backend/mysql/conf:/etc/mysql/conf.d"
      - "./backend/mysql/data:/var/lib/mysql"
      - "./backend/mysql/init:/docker-entrypoint-initdb.d"
    # Docker 硬限制（buffer_pool 64M + 连接/缓存 overhead）
    mem_limit: 350m
    restart: unless-stopped
    networks:
      - shared-infra

networks:
  shared-infra:
    name: shared-infra
